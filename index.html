<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="robots" content="noindex,nofollow">
<title>培训管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Cpath d='M18 18h20a8 8 0 018 8v22H26a8 8 0 01-8-8z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M26 30h12M26 38h8' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#e3ece8;--surface:#f6faf8;--surface2:#ecf3ef;--ink:#17211c;--ink2:#46544d;--ink3:#74837b;
  --line:#c9d8d1;--accent:#0d6b63;--accent-ink:#ffffff;--accent-soft:#cfe8e2;
  --k1:#d6ebe6;--k2:#fbe6c6;--k3:#dbe5f4;--k4:#eadcf1;
  --warn:#b45309;--warn-soft:#fdf0dc;--bad:#b42318;--bad-soft:#fde8e6;--ok:#15803d;--ok-soft:#e1f4e7;
  --c1:#0d6b63;--c2:#d98a1f;--c3:#5b72a0;--shadow:0 1px 2px rgba(20,40,30,.08),0 4px 14px rgba(20,40,30,.07);
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121715;--surface:#1b221f;--surface2:#171d1b;--ink:#e8eeea;--ink2:#a6b2ab;--ink3:#76827b;
    --line:#2b3430;--accent:#2fb5a8;--accent-ink:#06211e;--accent-soft:#163a36;
    --warn:#f0b35c;--warn-soft:#3a2b12;--bad:#ff8a7d;--bad-soft:#3d1c18;--ok:#6fcf8e;--ok-soft:#173222;
    --c1:#2fb5a8;--c2:#f0b35c;--c3:#8fa0b8;--shadow:none;--k1:#18403b;--k2:#44331a;--k3:#1f2d45;--k4:#35263f;
  }
}
:root[data-theme="dark"]{
  --bg:#121715;--surface:#1b221f;--surface2:#171d1b;--ink:#e8eeea;--ink2:#a6b2ab;--ink3:#76827b;
  --line:#2b3430;--accent:#2fb5a8;--accent-ink:#06211e;--accent-soft:#163a36;
  --warn:#f0b35c;--warn-soft:#3a2b12;--bad:#ff8a7d;--bad-soft:#3d1c18;--ok:#6fcf8e;--ok-soft:#173222;
  --c1:#2fb5a8;--c2:#f0b35c;--c3:#8fa0b8;--shadow:none;--k1:#18403b;--k2:#44331a;--k3:#1f2d45;--k4:#35263f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.small{font-size:13.5px}
.right{text-align:right}.nowrap{white-space:nowrap}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warnc{color:var(--warn)}

/* shell */
.shell{min-height:100vh;display:grid;grid-template-columns:1fr}
.side{display:none}
.main{min-width:0;padding-bottom:84px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.top h1{font-size:18px;flex:1}
.page{padding:16px;max-width:1080px;margin:0 auto}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11.5px;color:var(--ink3)}
.bottom a.on{color:var(--accent);font-weight:600}
.av.rk1{background:#f5d878;color:#6b4f00}.av.rk2{background:#d9dee3;color:#444}.av.rk3{background:#efc7a2;color:#6b3b12}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:31;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:28px;line-height:1;box-shadow:0 6px 18px rgba(15,118,110,.35);cursor:pointer}
@media(min-width:900px){
  .shell{grid-template-columns:220px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;padding:18px 12px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--surface2)}
  .side .brand{font-weight:700;font-size:16px;padding:6px 10px 14px}
  .side a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;color:var(--ink2)}
  .side a:hover{background:var(--accent-soft)}
  .side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .bottom{display:none}.main{padding-bottom:30px}
  .fab{bottom:24px;right:28px}
}

/* sync chip */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:inline-block}
.chip.synced i{background:var(--ok)}.chip.dirty i{background:var(--warn)}.chip.error i{background:var(--bad)}
.chip.syncing i{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* cards etc */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.card+.card,.card+.sec,.sec+.card,.sec+.sec{margin-top:14px}
.card h3,.sec>h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.sec>h3{margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:12.5px;color:var(--ink2)}.kpi .v{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink3)}
.kpi.warn .v{color:var(--warn)}.kpi.bad .v{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.grid2{grid-template-columns:1fr 1fr}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;min-height:38px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}.btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;pointer-events:none}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 0 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs a{padding:9px 14px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs a.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input,.filters select{min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;min-height:38px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--accent)}
.filters input,.filters select{width:auto}
.filters input[type=search]{flex:1;min-width:140px}
label.f{display:block;font-size:12.5px;color:var(--ink2)}
label.f>span{display:block;margin-bottom:3px}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--ink2)}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* lists/tables */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:default}
.li:first-child{border-top:0}
.li.click{cursor:pointer}.li.click:hover{background:var(--surface2)}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.li .t{font-weight:600}.li .d{font-size:12.5px;color:var(--ink2)}
.bal{text-align:right;min-width:74px}.bal b{font-size:20px;font-variant-numeric:tabular-nums}.bal small{display:block;font-size:11.5px;color:var(--ink3)}
.bar{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--accent)}
.tblw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl thead th{border-top:0;background:var(--surface2);font-size:12.5px;color:var(--ink2);font-weight:600;position:sticky;top:0}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:700;background:var(--surface2)}
.tbl td.wrap{white-space:normal;min-width:120px}
.empty{padding:28px 16px;text-align:center;color:var(--ink3)}
.hint{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13.5px}
.hint.warn{background:var(--warn-soft)}.hint.bad{background:var(--bad-soft)}

/* roster */
.roster{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.ros{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface);cursor:pointer;user-select:none}
.ros.on{border-color:var(--accent);background:var(--accent-soft)}
.ros.done{opacity:.6}
.ros .nm{flex:1;min-width:0;font-weight:600}.ros .nm small{display:block;font-weight:400;color:var(--ink2);font-size:12px}
.ros input.h{width:56px;min-height:32px;padding:3px 6px;text-align:center}

/* modal */
.mb{position:fixed;inset:0;z-index:100;background:rgba(10,15,12,.5);display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--bg);width:100%;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
.md header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.md header h2{flex:1;font-size:17px}
.md .bd{padding:16px;overflow:auto}
.md footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--surface)}
@media(min-width:700px){.mb{align-items:center}.md{width:560px;border-radius:16px;max-height:88vh}.md.wide{width:860px}}
.x{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--ink2);padding:0 4px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:200;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa .big{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:16px;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;text-align:left;width:100%}
.qa .big:hover{border-color:var(--accent)}.qa .big b{font-size:16px}.qa .big span{font-size:12.5px;color:var(--ink2)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
details.card>summary{cursor:pointer;font-weight:600}
pre.code{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12.5px;margin:6px 0}
ol.steps{padding-left:20px;margin:6px 0}ol.steps li{margin:6px 0}

/* print */
#print{display:none}
@media print{
  body{background:#fff!important}
  .shell,.mb,.toast,.fab{display:none!important}
  #print{display:block!important}
  @page{size:A4;margin:10mm}
}
.rcpt{width:190mm;border:1.5px solid #000;padding:6mm 7mm;color:#000;font-family:"SimSun","Songti SC","Noto Serif CJK SC",serif;font-size:13px;position:relative;background:#fff;margin:0 auto 10mm;page-break-inside:avoid}
.rcpt h2{text-align:center;font-size:20px;letter-spacing:3px;margin:0 0 8px}
.rcpt .r1{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0}
.rcpt table{width:100%;border-collapse:collapse;margin:4px 0}
.rcpt td{border:1px solid #000;padding:4px 6px;vertical-align:middle}
.rcpt td.k{width:20mm;text-align:center;line-height:1.2}
.rcpt .rs{position:absolute;right:1.5mm;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;letter-spacing:6px;font-size:14px;font-weight:700}
.rcpt .bx{display:inline-flex}.rcpt .bx span{width:7mm;height:8mm;border:1px solid #000;margin-left:-1px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.rcpt .bxh{display:inline-flex}.rcpt .bxh span{width:7mm;text-align:center;font-size:11px;margin-left:-1px}
.rcpt .note{font-size:11px;line-height:1.5;margin-top:6px;white-space:pre-line}
.rcpt .foot{display:flex;justify-content:space-between;margin-top:8px}
.pv{position:fixed;inset:0;z-index:150;background:rgba(10,15,12,.7);overflow:auto;padding:16px}
.pv .bar2{position:sticky;top:0;display:flex;gap:10px;justify-content:center;padding-bottom:12px}
.pv .sheet{background:#fff;width:210mm;max-width:100%;margin:0 auto;padding:10mm 10mm 2mm;overflow-x:auto}
@media print{.pv{display:none!important}}
.page>*+*{margin-top:14px}.page>.tabs+*,.page>.tabs{margin-top:0}.page>.tabs{margin-bottom:14px}
.list .li:first-child{border-top:0}
body.ro .fab{display:none}
#lock{position:fixed;inset:0;z-index:500;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
.lockbox{width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 22px;box-shadow:var(--shadow)}
.lockbox input{text-align:center;font-size:18px}
.rwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.rwc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.rwc .rn{font-weight:600}.rwc b{color:var(--accent);font-size:17px}.rwc small{color:var(--ink2);font-size:12.5px}
.rwc.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}.rwc.dis{opacity:.5;cursor:not-allowed}

/* ---- 三/七：等高卡片、更大字体、着色 ---- */
.grid2>.card,.grid3>.card{margin:0}.grid2{align-items:stretch}.grid2>.card{height:100%}
.btn{font-size:15.5px;padding:9px 16px;min-height:40px}.btn.sm{font-size:14px;min-height:34px}
.li{font-size:16px;padding-top:12px;padding-bottom:12px}
.tbl{font-size:15px}.tabs a{font-size:15.5px}
input,select,textarea{font-size:16px}
.kpi,.kpis>*{background:var(--k1)}
.kpis>*:nth-child(4n+2){background:var(--k2)}.kpis>*:nth-child(4n+3){background:var(--k3)}.kpis>*:nth-child(4n+4){background:var(--k4)}
.kpis>* .v,.kpi .v{font-size:26px}
.card{border-color:var(--line)}
.ic{width:1.25em;height:1.25em;vertical-align:-.22em}
nav .on svg,.bnav .on svg{fill:var(--accent-soft)}
.bnav a,.side a{font-size:14.5px}.bnav svg{width:26px;height:26px}

/* 只读模式：醒目提示 */
#roBar{position:sticky;top:0;z-index:60;background:#b45309;color:#fff;text-align:center;font-weight:700;font-size:15px;padding:7px 12px;letter-spacing:.5px}
body.ro{--bg:#efe2cf;--surface:#faf3e8;--surface2:#f3e7d4;--line:#dcc9ac}
body.ro .top{background:#fbe3bd}
.cmp .f span{font-size:13px}.cmp .f input,.cmp .f select{padding:7px 10px;min-height:36px}
.md .bd .grid3.cmp{gap:8px 10px}
@media(max-width:699px){.grid3.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}}

</style>
</head>

<div id="app"></div>
<div id="print"></div>
<script>
'use strict';
/* ============ 工具函数 ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const p2 = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
class Raw { constructor(s) { this.s = s; } toString() { return this.s; } }
const raw = s => new Raw(s);
const cat = v => v instanceof Raw ? v.s : Array.isArray(v) ? v.map(cat).join('') : esc(v);
function html(strs, ...vals) { let o = strs[0]; vals.forEach((v, i) => { o += cat(v) + strs[i + 1]; }); return new Raw(o); }
const today = () => { const d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const WDORDER = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const dateObj = ds => new Date(ds + 'T00:00:00');
const wdOf = ds => ds ? WD[dateObj(ds).getDay()] : '';
const addDays = (ds, n) => { const d = dateObj(ds); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const money = n => { n = num(n); const s = Math.abs(n).toLocaleString('zh-CN', { maximumFractionDigits: 2 }); return (n < 0 ? '-' : '') + '¥' + s; };
const fh = n => String(Math.round(num(n) * 100) / 100);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ymOf = d => d ? d.slice(0, 7) : '';
const monthLabel = ym => ym.endsWith('-00') ? ym.slice(0, 4) + '年(月份未记录)' : ym.slice(0, 4) + '年' + parseInt(ym.slice(5), 10) + '月';
const sum = (a, f) => a.reduce((s, x) => s + num(f(x)), 0);
const uniq = a => [...new Set(a)];
const cmpStr = (a, b) => String(a || '').localeCompare(String(b || ''), 'zh-CN');

function cnMoney(v) {
  v = Math.round(Math.abs(num(v)) * 100); if (v === 0) return '零元整';
  const D = '零壹贰叁肆伍陆柒捌玖', U = ['', '拾', '佰', '仟'], BIG = ['', '万', '亿', '万亿'];
  const yuan = Math.floor(v / 100), jiao = Math.floor(v / 10) % 10, fen = v % 10; let s = '';
  if (yuan > 0) {
    const str = String(yuan), g = []; for (let e = str.length; e > 0; e -= 4) g.unshift(str.slice(Math.max(0, e - 4), e));
    g.forEach((seg, gi) => {
      if (!+seg) return; let part = '', z = false;
      for (let k = 0; k < seg.length; k++) { const d = +seg[k], pos = seg.length - 1 - k; if (d === 0) z = true; else { if (z && part) part += '零'; z = false; part += D[d] + U[pos]; } }
      if (gi > 0 && +seg < 1000 && s) part = '零' + part;
      s += part + BIG[g.length - 1 - gi];
    });
    s += '元';
  }
  if (!jiao && !fen) s += '整'; else { if (jiao) s += D[jiao] + '角'; else if (yuan > 0) s += '零'; if (fen) s += D[fen] + '分'; }
  return s;
}

const COLS = ['students', 'classes', 'payments', 'attendance', 'rooms', 'roomPays', 'partners', 'sessions', 'settlements', 'points', 'rewards'];
const DEFAULT_NOTES = '① 此单据为学员注册缴费、转班、退费等唯一有效凭证，请妥善保管。\n② 转班以非折扣课时单价核算后，将余额部分按照对应新课程费用情况结转。\n③ 退费以非折扣课时单价核算后，将余额部分退还。';
const DEFAULT_SETTINGS = () => ({
  org: '我的培训', payee: '', phone: '', unitPrice: 150, receiptNext: 10001, lowHours: 5,
  courses: [], details: [], methods: ['微信', '支付宝', '现金', '银行卡'], receiptNotes: DEFAULT_NOTES, pointRules: '', roomUnit: 38, roomThreshold: 1000, u: 0
});
function emptyDB() { const d = { schema: 1, updatedAt: 0, settings: DEFAULT_SETTINGS(), deleted: {} }; COLS.forEach(c => d[c] = []); return d; }
function normalize(d) {
  const e = emptyDB(); if (!d || typeof d !== 'object') return e;
  e.updatedAt = d.updatedAt || 0; e.deleted = d.deleted || {};
  e.settings = Object.assign(DEFAULT_SETTINGS(), d.settings || {});
  COLS.forEach(c => { e[c] = Array.isArray(d[c]) ? d[c] : []; });
  migrateRooms(e);
  e.settlements.filter(x => !x.no).sort((a, b) => String(a.date).localeCompare(b.date)).forEach(x => { const n = Math.max(0, ...e.settlements.map(y => parseInt(String(y.no || '').replace(/\D/g, ''), 10) || 0)); x.no = 'JS-' + String(n + 1).padStart(4, '0'); });
  return e;
}
/** 旧版场地记录(带费用)迁移：有费用的行 → 场地付费；其余作为“历史使用次数” */
function migrateRooms(e) {
  if (!e.rooms.some(r => !r.kind)) return;
  const pays = []; e.rooms = e.rooms.map(r => { if (r.kind) return r; if (num(r.cost) > 0) pays.push({ id: 'rp-' + r.id, date: r.date, amount: num(r.cost), note: r.note || '', u: r.u || 0 }); const { cost, ...rest } = r; return Object.assign(rest, { kind: 'legacy' }); });
  pays.forEach(p => { if (!e.roomPays.some(x => x.id === p.id)) e.roomPays.push(p); });
}
function serialize(db) {
  const parts = Object.keys(db).map(k => {
    const v = db[k];
    return JSON.stringify(k) + ':' + (Array.isArray(v) ? (v.length ? '[\n' + v.map(x => JSON.stringify(x)).join(',\n') + '\n]' : '[]') : JSON.stringify(v));
  });
  return '{\n' + parts.join(',\n') + '\n}\n';
}
function mergeDB(a, b) { // a=本地, b=远端
  const out = emptyDB(); out.deleted = Object.assign({}, b.deleted);
  for (const k in a.deleted) out.deleted[k] = Math.max(out.deleted[k] || 0, a.deleted[k]);
  COLS.forEach(c => {
    const m = new Map();
    [...b[c], ...a[c]].forEach(r => { const o = m.get(r.id); if (!o || (r.u || 0) >= (o.u || 0)) m.set(r.id, r); });
    out[c] = [...m.values()].filter(r => !(out.deleted[r.id] > (r.u || 0)));
  });
  out.settings = (a.settings.u || 0) >= (b.settings.u || 0) ? a.settings : b.settings;
  out.updatedAt = Math.max(a.updatedAt, b.updatedAt); return out;
}

/* ============ GitHub 同步 ============ */
const GH = 'https://api.github.com';
class GhError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
const b64enc = t => { const b = new TextEncoder().encode(t); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const b64dec = t => { const s = atob(t.replace(/\n/g, '')); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return new TextDecoder().decode(b); };
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
async function ghFetch(path, opt = {}) {
  return fetch(GH + path, { cache: 'no-store', ...opt, headers: { 'Authorization': 'Bearer ' + CFG.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opt.headers || {}) } });
}
async function ghErr(r) { let m = ''; try { m = (await r.json()).message; } catch (e) { } return new GhError(r.status, m || ('HTTP ' + r.status)); }
const contentsUrl = p => `/repos/${CFG.owner}/${CFG.repo}/contents/${encPath(p)}`;
async function ghGetFile(path) {
  const url = contentsUrl(path) + '?ref=' + encodeURIComponent(CFG.branch);
  const r = await ghFetch(url); if (r.status === 404) return null; if (!r.ok) throw await ghErr(r);
  const j = await r.json(); if (Array.isArray(j)) throw new GhError(400, '路径是目录');
  let text;
  if (j.content && j.encoding === 'base64') text = b64dec(j.content);
  else { const r2 = await ghFetch(url, { headers: { 'Accept': 'application/vnd.github.raw+json' } }); if (!r2.ok) throw await ghErr(r2); text = await r2.text(); }
  return { sha: j.sha, text };
}
async function ghPutFile(path, text, sha, msg) {
  const body = { message: msg, content: b64enc(text), branch: CFG.branch }; if (sha) body.sha = sha;
  const r = await ghFetch(contentsUrl(path), { method: 'PUT', body: JSON.stringify(body) });
  if (!r.ok) throw await ghErr(r); return (await r.json()).content.sha;
}
async function ghPutB64(path, b64, sha, msg) {
  const body = { message: msg, content: b64, branch: CFG.branch }; if (sha) body.sha = sha;
  const r = await ghFetch(contentsUrl(path), { method: 'PUT', body: JSON.stringify(body) }); if (!r.ok) throw await ghErr(r); return (await r.json()).content.sha;
}
async function ghGetBlob(path) {
  const r = await ghFetch(contentsUrl(path) + '?ref=' + encodeURIComponent(CFG.branch), { headers: { 'Accept': 'application/vnd.github.raw+json' } }); if (!r.ok) throw await ghErr(r); return r.blob();
}
async function ghList(dir) {
  const r = await ghFetch(contentsUrl(dir) + '?ref=' + encodeURIComponent(CFG.branch)); if (r.status === 404) return [];
  if (!r.ok) throw await ghErr(r); const j = await r.json(); return Array.isArray(j) ? j : [];
}
const dateOfTs = ts => { const d = new Date(ts); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };

let SYNC = { state: 'local', msg: '', busy: false, again: false };
function setSync(state, msg = '') { SYNC.state = state; SYNC.msg = msg; if (typeof renderChrome === 'function') renderChrome(); }

/** 同步：拉取远端 → 合并 → 推送。每天第一次修改前，把“前一次的最终状态”另存为 backups/data-日期.json */
async function syncNow(force = false) {
  if (!ghReady()) { setSync('local'); return; }
  if (SYNC.busy) { SYNC.again = true; return; }
  SYNC.busy = true; setSync('syncing');
  try {
    await detectRole();
    for (let attempt = 0; attempt < 4; attempt++) {
      const remote = await ghGetFile(CFG.path);
      let changedLocal = false;
      if (remote && !CFG.forcePush) {
        if (remote.sha !== CFG.sha) {
          const rdb = normalize(JSON.parse(remote.text));
          if (!RO() && (CFG.dirty || !CFG.sha)) { DB = mergeDB(DB, rdb); CFG.dirty = true; } else { DB = rdb; CFG.dirty = false; }
          CFG.sha = remote.sha; changedLocal = true;
        }
      } else if (remote && CFG.forcePush) { CFG.sha = remote.sha; }
      else if (!remote) { CFG.sha = null; if (!CFG.dirty && DB.updatedAt) CFG.dirty = true; }
      if (changedLocal) { invalidate(); saveLocal(); saveCfg(); render(); }
      if (RO()) { CFG.dirty = false; break; }
      if (!CFG.dirty) break;
      // 每日备份：远端文件若不是今天更新的，则按其更新日期另存一份
      if (remote) {
        try {
          const rts = JSON.parse(remote.text).updatedAt || 0; const d = rts ? dateOfTs(rts) : '';
          if (CFG.forcePush) { await ghPutFile(`${CFG.backupDir}/pre-restore-${Date.now()}.json`, remote.text, null, 'backup before restore'); }
          else if (d && d !== today()) {
            if (CFG.backedUp !== d) {
              try { await ghPutFile(`${CFG.backupDir}/data-${d}.json`, remote.text, null, 'daily backup ' + d); } catch (e) { if (e.status !== 422) throw e; }
              CFG.backedUp = d;
            }
            if (CFG.backedUpX !== d) { // 同时生成 Excel 版备份（失败不影响主流程，下次再试）
              try {
                await putXlsxFiles('data-' + d, normalize(JSON.parse(remote.text)), 'daily backup (xlsx) ' + d);
                CFG.backedUpX = d;
              } catch (e) { console.warn('xlsx backup failed', e); }
            }
          }
        } catch (e) { console.warn('backup failed', e); }
      }
      try {
        const sha = await ghPutFile(CFG.path, serialize(DB), CFG.sha, 'update ' + new Date().toLocaleString('zh-CN', { hour12: false }));
        CFG.sha = sha; CFG.dirty = false; CFG.forcePush = false; CFG.lastSync = Date.now(); saveCfg(); break;
      } catch (e) { if ((e.status === 409 || e.status === 422) && attempt < 3) { CFG.sha = remote ? CFG.sha : null; CFG.forcePush = false; continue; } throw e; }
    }
    CFG.lastSync = Date.now(); saveCfg(); setSync(CFG.dirty ? 'dirty' : 'synced');
  } catch (e) {
    console.error(e);
    if (e.status === 403 && /not accessible|read-only|permission/i.test(e.message || '') && CFG.role !== 'readonly') { CFG.role = 'readonly'; CFG.dirty = false; saveCfg(); setSync('synced'); toast('当前 Token 只有只读权限，已切换为只读模式'); render(); return; }
    const m = e.status === 401 ? 'Token 无效或已过期' : e.status === 403 ? '权限不足/请求受限' : e.status === 404 ? '找不到仓库或分支(检查名称、分支是否已创建、Token权限)' : (e.message || '网络错误');
    setSync('error', m);
  } finally { SYNC.busy = false; if (SYNC.again) { SYNC.again = false; setTimeout(syncNow, 300); } }
}
window.addEventListener('online', () => { if (ghReady() && CFG.dirty) syncNow(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && ghReady() && !SYNC.busy) syncNow(); });

/* ============ 访问控制：设备密码锁 + 只读/管理员 + 授权链接 ============ */
const LS_ENC = 'tm_data_enc_v1';
const LOCK = { locked: false };
let KEY = null, SAVEP = Promise.resolve(), ROLE_DONE = false, PENDING_JOIN = null, hiddenAt = 0;
const RO = () => CFG.role === 'readonly';
const toB64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = s => { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
const b64url = s => toB64(new TextEncoder().encode(s)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64url = s => new TextDecoder().decode(fromB64(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)));
async function deriveKey(pw, salt) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

function saveEncrypted() {
  SAVEP = SAVEP.then(async () => { const o = await encStr(KEY, JSON.stringify(DB)); if (lsSet(LS_ENC, JSON.stringify(o))) { try { localStorage.removeItem(LS_DATA); } catch (e) { } } }).catch(e => console.error(e));
}
async function refreshLock() { if (CFG.lock && KEY) { CFG.lock = Object.assign({ salt: CFG.lock.salt }, await encStr(KEY, CFG.token || '')); saveCfg(); } }
async function enablePassword(pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)); KEY = await deriveKey(pw, salt);
  CFG.lock = Object.assign({ salt: toB64(salt) }, await encStr(KEY, CFG.token || '')); saveCfg(); saveEncrypted(); await SAVEP;
}
async function disablePassword() { lsSet(LS_DATA, JSON.stringify(DB)); try { localStorage.removeItem(LS_ENC); } catch (e) { } CFG.lock = null; KEY = null; saveCfg(); }
async function tryUnlock(pw) {
  const key = await deriveKey(pw, fromB64(CFG.lock.salt)); const tok = await decStr(key, CFG.lock); // 密码错误会抛异常
  KEY = key; CFG.token = tok; const e = lsGet(LS_ENC); if (e) DB = normalize(JSON.parse(await decStr(key, JSON.parse(e)))); invalidate(); LOCK.locked = false;
}
function showLock() {
  LOCK.locked = true; let el = $('#lock'); if (!el) { el = document.createElement('div'); el.id = 'lock'; document.body.appendChild(el); }
  el.innerHTML = `<form class="lockbox" autocomplete="off"><div style="color:var(--accent)">${cat(ic('lock', 40))}</div><h2>培训管理</h2><div class="small muted">请输入设备解锁密码</div><input type="password" id="lockpw" autocomplete="current-password" placeholder="密码" autofocus><div class="bad small" id="lockerr" style="min-height:20px"></div><button class="btn primary" type="submit" style="width:100%">解锁</button><div style="margin-top:12px"><a href="javascript:void 0" data-act="lockForget" class="small">忘记密码？</a></div></form>`;
  el.style.display = 'flex'; setTimeout(() => $('#lockpw') && $('#lockpw').focus(), 50);

    try { await tryUnlock($('#lockpw').value); el.style.display = 'none'; ROLE_DONE = false; render(); if (ghReady()) syncNow(); if (PENDING_JOIN) { const p = PENDING_JOIN; PENDING_JOIN = null; offerJoin(p); } }
    catch (err) { $('#lockerr').textContent = '密码不正确'; $('#lockpw').select(); } btn.disabled = false;
  };
}
async function lockNow() { if (!CFG.lock || !KEY) return; await SAVEP; KEY = null; CFG.token = ''; DB = emptyDB(); invalidate(); closeModals(); showLock(); }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') hiddenAt = Date.now();
  else if (CFG.lock && KEY && hiddenAt && Date.now() - hiddenAt > 15 * 60 * 1000) lockNow();

/** 探测 Token 是否有写权限：用一个“必然被拒绝”的写请求（错误的 sha），只读 Token 返回 403，有写权限的返回 409/422，不会改动任何数据。
 *  注意：不能用仓库接口里的 permissions 字段——它反映的是“账号”权限，仓库所有者即使用只读 Token 也会显示可写。 */
async function probeWrite(token, owner, repo, branch, path) {
  const url = `${GH}/repos/${owner}/${repo}/contents/${encPath(path)}`;
  const r = await fetch(url, { method: 'PUT', cache: 'no-store', headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, body: JSON.stringify({ message: 'permission probe (rejected, no change)', content: 'e30=', sha: '0000000000000000000000000000000000000000', branch }) });
  if (r.status === 401) throw new Error('Token 无效或已过期');
  if (r.status === 403) { let m = ''; try { m = (await r.json()).message || ''; } catch (e) { } if (/rate limit|abuse/i.test(m)) throw new Error('GitHub 请求太频繁，请稍后再试'); return 'readonly'; }
  if (r.status === 404) { // 文件不存在或无权访问：用仓库接口区分
    const g = await fetch(`${GH}/repos/${owner}/${repo}`, { cache: 'no-store', headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' } });
    if (!g.ok) throw new Error('该 Token 无权访问这个数据仓库（检查仓库名、分支和 Token 的仓库范围）'); return 'admin';
  }
  return 'admin'; // 409/422：请求已通过权限检查、被校验拒绝 => 有写权限
}
async function detectRole() {
  if (ROLE_DONE || !ghReady()) return; ROLE_DONE = true;
  try { CFG.role = await probeWrite(CFG.token, CFG.owner, CFG.repo, CFG.branch, CFG.path); saveCfg(); renderChrome(); } catch (e) { ROLE_DONE = false; console.warn('role probe failed', e.message); }
}
/* ---- 授权链接 ---- */
const checkTokenRole = token => probeWrite(token, CFG.owner, CFG.repo, CFG.branch, CFG.path);
async function makeJoin(token, note) {

  const W = 680, H = h, pl = 48, pr = 8, pt = 12, pb = 28; const colors = ['var(--c1)', 'var(--c2)', 'var(--c3)'];

  const bw = (W - pl - pr) / n, bar = Math.max(3, Math.min(20, bw * 0.78 / K - 2)), gap = 2, gw = bar * K + gap * (K - 1);
  let g = ''; for (let i = 0; i <= 2; i++) { const y = pt + (H - pt - pb) * (1 - i / 2); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end" font-size="12" fill="var(--ink3)">${esc(fmt(max * i / 2))}</text>`; }
  const step = n > 16 ? Math.ceil(n / 12) : 1;
  cats.forEach((c, i) => {
    const cx = pl + bw * i + bw / 2, x0 = cx - gw / 2;
    series.forEach((s, k) => { const v = Math.max(0, s.v[i] || 0), bh = (H - pt - pb) * v / max; if (v > 0) g += `<rect x="${x0 + (bar + gap) * k}" y="${H - pb - bh}" width="${bar}" height="${bh}" rx="2" fill="${colors[k % 3]}"><title>${esc(c + ' ' + s.name + '：' + fmt(s.v[i] || 0))}</title></rect>`; });

  });
  return html`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${raw(g)}</svg><div class="legend">${series.map((s, k) => html`<span><i style="background:${raw(colors[k % 3])}"></i>${s.name}</span>`)}</div>`;

/** 退费计算：每次缴费按各自保存的原价；已上课时按缴费先后依次冲抵；活动赠送最后消耗（中途退费默认没用到） */

  cost = r2(cost); const refund = Math.max(0, r2(paid - cost)), remain = Math.max(0, r2(pool - cu));

}

/* ============ 场地成本：按消课自动统计场地次数，累计到阈值提醒付费，付费后清零 ============ */
function venueRows() {
  const I = IDX(); const leg = {}, ex = {}, xt = {}; let legEnd = '';
  DB.rooms.forEach(r => { const k = r.kind || 'legacy'; const m = k === 'legacy' ? leg : k === 'exempt' ? ex : xt; (m[r.date] = m[r.date] || []).push(r); if (k === 'legacy' && r.date > legEnd) legEnd = r.date; });
  const att = {};
  DB.attendance.forEach(a => { if (a.date <= legEnd) return; const s = I.stu[a.studentId]; const cid = a.classId || (s && s.classId) || ''; (att[a.date] = att[a.date] || new Set()).add(cid); });
  const dates = uniq([...Object.keys(leg), ...Object.keys(att), ...Object.keys(ex), ...Object.keys(xt)]).sort();
  return dates.map(d => {
    let items = [], n = 0; const old = d <= legEnd;
    if (old) (leg[d] || []).forEach(r => { n += num(r.hours); if (num(r.hours) > 0) items.push({ k: '', label: r.note || '（历史记录）' }); });
    else { const set = att[d] || new Set(); const real = [...set].filter(Boolean); if (real.length) items = real.map(c => ({ k: c, label: clsName(c) || '(班级已删除)' })); else if (set.size) items = [{ k: '', label: '未分班/试听' }]; n = items.length; }
    const exs = ex[d] || [];
    exs.forEach(e => { if (!e.classId) { n = 0; items = []; } else if (!old) { const i = items.findIndex(x => x.k === e.classId); if (i >= 0) { items.splice(i, 1); n--; } } else n = Math.max(0, n - 1); });
    (xt[d] || []).forEach(e => { n += num(e.hours || 1); items.push({ k: '', label: '加场次：' + (e.note || '') }); });
    return { date: d, n, items: items.map(x => x.label), legacy: old, exempt: exs, extra: xt[d] || [] };
  }).filter(r => r.n > 0 || r.exempt.length || r.extra.length);
}
function venuePeriods() {
  const rows = venueRows(), pays = DB.roomPays.slice().sort((a, b) => a.date.localeCompare(b.date));
  const unit = num(DB.settings.roomUnit) || 38, th = num(DB.settings.roomThreshold) || 1000; const done = []; let prev = '';
  pays.forEach(p => { const rs = rows.filter(r => r.date > prev && r.date <= p.date); const n = sum(rs, r => r.n); done.push({ pay: p, start: prev, end: p.date, rows: rs, n, est: n * unit, paid: num(p.amount) }); prev = p.date; });
  const rs = rows.filter(r => r.date > prev); const n = sum(rs, r => r.n);
  return { done, cur: { start: prev, rows: rs, n, est: n * unit }, unit, th };
}
function venueStatus() { const V = venuePeriods(); return { n: V.cur.n, est: V.cur.est, th: V.th, unit: V.unit, due: V.cur.est >= V.th, need: Math.max(0, Math.ceil((V.th - V.cur.est) / V.unit)) }; }

  histView: async el => { try { const f = await ghGetFile(el.dataset.id); const d = normalize(JSON.parse(f.text)); modal('备份预览', html`<div class="card small">${summaryOf(d)}</div><div class="small muted" style="margin-top:10px">${el.dataset.id}</div>`); } catch (e) { toast('读取失败：' + e.message); } },
  histDl: async el => { try { downloadBlob(el.dataset.id.split('/').pop(), await ghGetBlob(el.dataset.id)); } catch (e) { toast('下载失败：' + e.message); } },
  histRestore: async el => {
    try {
      const f = await ghGetFile(el.dataset.id); const d = normalize(JSON.parse(f.text));
      if (!confirm('用这份备份覆盖当前数据？\n\n备份内容：' + summaryOf(d) + '\n\n当前数据会先自动另存一份（pre-restore），可再还原回来。')) return;
      DB = d; CFG.forcePush = true; commit(); toast('已还原，正在同步…'); HIST.list = null;
    } catch (e) { toast('还原失败：' + e.message); }
  },
  wipe() { if (!confirm('清空本机数据？（不会删除 GitHub 上的数据；如果已连接，下次同步会重新拉取。）')) return; if (!confirm('再确认一次：清空这台设备上的全部本地数据？')) return; DB = emptyDB(); CFG.sha = null; CFG.dirty = false; invalidate(); saveLocal(); saveCfg(); render(); toast('已清空'); },
};
Object.assign(A, AUTH_ACT);
function closeModals() { $$('.mb').forEach(m => m.remove()); }
const READ_ACTS = new Set(['chip', 'stu', 'stuF', 'stuAttAll', 'csv', 'attExport', 'attMore', 'payExport', 'payMore', 'sessMore', 'setOpen', 'setPrint', 'ptSort', 'ptSt', 'ptMore', 'statCsv', 'syncNow', 'theme', 'exportJson', 'exportXlsx', 'qaTog', 'qaGo', 'histLoad', 'histView', 'histDl', 'ghOff', 'lockNow', 'lockForget', 'payFilterR', 'copyJoin', 'pwOff', 'pwChange', 'ptSt', 'venueView', 'recvList', 'venueHist']);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (e.target !== el && e.target.matches('input,select,textarea') && !e.target.dataset.act) return;
  if (RO() && !READ_ACTS.has(el.dataset.act)) { e.preventDefault(); toast('只读账号只能查看，不能修改'); return; }
  const f = A[el.dataset.act]; if (f) { if (el.tagName === 'A') e.preventDefault(); f(el, e); }
});

/* ============ 事件：change / input / submit ============ */
function sessRecalc(f) {
  const p = IDX().par[f.partnerId.value]; if (!p) return; const v = { hours: f.hours.value, headcount: f.headcount.value, revenue: f.revenue ? f.revenue.value : 0 };
  if (f.amount.dataset.auto === '1') f.amount.value = calcAmount(p, v);
  $('#sessHint', f).firstChild.textContent = formulaHint(p, v) + '　';
}
const CH = {
  stuC(el) { UI.stuC = el.value; render(); },
  memSt(el) { memFilter(el.closest('.mb')); },
  qaDate(el) { QA.date = el.value || today(); qaReset(); render(); },
  qaClass(el) { QA.classId = el.value; QA.extra = []; qaReset(); render(); },
  qaType(el) { QA.type = el.value; QA.hours = el.value === '试听' ? 0 : (QA.hours === 0 ? 1 : QA.hours); QA.hrs = {}; render(); },
  qaHours(el) { QA.hours = el.value === '' ? 1 : num(el.value); QA.hrs = {}; render(); },
  qaAdd(el) { if (!el.value) return; QA.extra.push(el.value); QA.chk[el.value] = true; render(); },
  attM(el) { UI.attM = el.value; UI.attN = 120; render(); }, payY(el) { UI.payY = el.value; UI.payN = 120; render(); }, payR(el) { UI.payR = el.value; render(); },
  sessM(el) { UI.sessM = el.value; UI.sessN = 150; render(); }, sessS(el) { UI.sessS = el.value; render(); },
  statY(el) { UI.statY = el.value; render(); },
  ptStu(el) { UI.ptStu = el.value; render(); }, ptKind(el) { UI.ptKind = el.value; render(); },
  rwStu(el) { rwHint(el.closest('form')); },
  ptBatchCls(el) { const f = el.closest('form'); $$('.ros', f).forEach(r => { r.style.display = (!el.value || r.dataset.cls === el.value || (el.value === '__none' && !r.dataset.cls)) ? '' : 'none'; }); },
  payStu(el) { const f = el.closest('form'); const s = IDX().stu[el.value]; if (s && !f.payer.value) f.payer.value = s.parent || ''; },
  parMode(el) { $('#rateLbl', el.closest('form')).textContent = MODES[el.value][1]; },
  sessPar(el) { const f = el.closest('form'); const p = IDX().par[el.value]; if (!p) return; $('#revWrap', f).style.display = p.mode === 'share' ? '' : 'none'; f.amount.dataset.auto = '1'; sessRecalc(f); },
  importFile(el) {
    if (RO()) { toast('只读账号不能导入'); return; }
    const file = el.files[0]; if (!file) return; const rd = new FileReader();
    rd.onload = () => {
      let d; try { d = normalize(JSON.parse(rd.result)); } catch (e) { toast('文件不是有效的 JSON'); return; }
      const m = modal('导入数据', html`<div class="card small" style="margin-bottom:12px"><b>文件内容：</b>${summaryOf(d)}</div><div class="card small"><b>当前数据：</b>${summaryOf(DB)}</div><div class="row" style="margin-top:14px"><button class="btn primary" data-i="over">覆盖当前数据</button><button class="btn" data-i="merge">与当前数据合并</button><button class="btn" data-i="x">取消</button></div><div class="small muted" style="margin-top:10px">覆盖：以文件为准（同步到 GitHub 时也会覆盖云端）。合并：按记录编号取最新修改的版本，并集。</div>`);
      m.addEventListener('click', ev => { const k = ev.target.dataset.i; if (!k) return; if (k === 'over') { DB = d; DB.updatedAt = Date.now(); CFG.forcePush = ghReady(); commit(); toast('已导入（覆盖）'); } else if (k === 'merge') { DB = mergeDB(DB, d); commit(); toast('已合并导入'); } m.close(); });
    }; rd.readAsText(file); el.value = '';
  },
};
document.addEventListener('change', e => { const n = e.target.dataset && e.target.dataset.chg; if (n && CH[n]) CH[n](e.target); });
const IN = {
  stuQ(el) { UI.stuQ = el.value; renderPage(); }, attQ(el) { UI.attQ = el.value; UI.attN = 120; renderPage(); }, payQ(el) { UI.payQ = el.value; UI.payN = 120; renderPage(); },
  memQ(el) { memFilter(el.closest('.mb')); },
  qaH(el) { QA.hrs[el.dataset.id] = el.value; }, qaNote(el) { QA.note = el.value; },
  rwCost(el) { const f = el.closest('form'); f.reward.value = (DB.rewards.find(r => r.id === f.reward.value && num(r.cost) === num(el.value)) || {}).id || ''; rwHint(f); },
  sessCalc(el) { sessRecalc(el.closest('form')); }, sessAmt(el) { el.dataset.auto = '0'; },
};
document.addEventListener('input', e => { const n = e.target.dataset && e.target.dataset.in; if (n && IN[n]) IN[n](e.target); });
document.addEventListener('submit', e => {
  const n = e.target.dataset && e.target.dataset.submit; if (!n) return; e.preventDefault();
  const fd = {}; new FormData(e.target).forEach((v, k) => fd[k] = typeof v === 'string' ? v.trim() : v);
  if (RO() && n !== 'gh') { toast('只读账号不能修改设置'); return; }
  if (n === 'pw') { if (fd.pw1 !== fd.pw2) { toast('两次输入不一致'); return; } if (!(window.crypto && crypto.subtle)) { toast('当前环境不支持加密，请用 https 网址打开'); return; } enablePassword(fd.pw1).then(() => { render(); toast('已开启设备密码 🔒'); }); return; }
  if (n === 'join') { makeJoin(fd.token, fd.note).catch(err => toast(err.message || '生成失败')); return; }
  if (n === 'gh') {
    Object.assign(CFG, { owner: fd.owner.replace(/^.*github\.com\//, '').replace(/\/.*$/, ''), repo: fd.repo.replace(/\.git$/, ''), branch: fd.branch || 'main', path: fd.path || 'data.json', token: fd.token });
    if (!ghReady()) { toast('请填写用户名、仓库名和 Token'); return; } CFG.sha = null; CFG.role = ''; ROLE_DONE = false; refreshLock(); saveCfg(); render(); toast('正在连接…'); syncNow().then(() => { if (SYNC.state === 'synced') toast('已连接并同步 ✓'); });
  }
  if (n === 'prefs') {
    const S = DB.settings; const ls = t => (t || '').split(/\n/).map(x => x.trim()).filter(Boolean);
    Object.assign(S, { org: fd.org, payee: fd.payee, phone: fd.phone, unitPrice: num(fd.unitPrice), lowHours: num(fd.lowHours), receiptNext: num(fd.receiptNext), courses: ls(fd.courses), details: ls(fd.details), methods: ls(fd.methods), receiptNotes: fd.receiptNotes, pointRules: fd.pointRules, roomUnit: num(fd.roomUnit) || 38, roomThreshold: num(fd.roomThreshold) || 1000, u: Date.now() });
    commit(); toast('已保存');
  }
});

/* ============ 启动 ============ */
function init() {
  loadLocal(); applyTheme(); buildShell(); setSync(ghReady() ? (CFG.dirty ? 'dirty' : 'synced') : 'local');
  const join = parseJoinHash();
  if (!location.hash) location.hash = '#/home';
  if (CFG.lock) { LOCK.locked = true; if (join) PENDING_JOIN = join; if (!(window.crypto && crypto.subtle)) { alert('当前环境不支持解密，请用 https 网址打开'); } showLock(); return; }
  render(); if (join) offerJoin(join);
  if (ghReady()) syncNow();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { /* 预留：离线缓存 */ }
}
document.addEventListener('DOMContentLoaded', init);

</script>
